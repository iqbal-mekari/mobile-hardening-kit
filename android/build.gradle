group = "com.mekari.mobile_hardening_kit"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.0.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Built-in Kotlin (AGP 9): no kotlin-android plugin. Apps that opt out (android.builtInKotlin=false)
// get KGP applied to this module by the Flutter Gradle plugin.
apply plugin: "com.android.library"
apply plugin: "jacoco"

android {
    namespace = "com.mekari.mobile_hardening_kit"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ["jdk.internal.*"]
                }
            }
        }
    }

    lint {
        warningsAsErrors = true
        abortOnError = true
        // Same rationale as native/android/core/build.gradle (pinned toolchain; no androidx.annotation).
        disable += ["AndroidGradlePluginVersion", "UseRequiresApi"]
    }

    sourceSets {
        // Native core shared with the standalone native/android library.
        main.kotlin.srcDirs("../native/android/core/src/main/kotlin")
    }

    defaultConfig {
        minSdk = 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        allWarningsAsErrors = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "org.mockito:mockito-core:5.11.0"
}

// Adapter-only coverage gate (the shared native core is gated in native/android).
// Run from example/flutter/android: ./gradlew :mobile_hardening_kit:testDebugUnitTest :mobile_hardening_kit:coverageVerification
def coverageExec = layout.buildDirectory.file("outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec").get().asFile
// Read the class output from the compile task (built-in Kotlin and KGP use different dirs), resolved lazily.
def adapterClasses = files({ tasks.named("compileDebugKotlin").get().destinationDirectory }).asFileTree.matching {
    include "**/MobileHardeningKitPlugin*.class"
}
def requireCoverageData = { ->
    if (!coverageExec.exists()) throw new GradleException("No coverage data at $coverageExec")
}

tasks.register("coverageReport", JacocoReport) {
    dependsOn "testDebugUnitTest"
    doFirst(requireCoverageData)
    classDirectories.setFrom(adapterClasses)
    sourceDirectories.setFrom(files("src/main/kotlin"))
    executionData.setFrom(files(coverageExec))
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register("coverageVerification", JacocoCoverageVerification) {
    dependsOn "testDebugUnitTest"
    doFirst(requireCoverageData)
    classDirectories.setFrom(adapterClasses)
    executionData.setFrom(files(coverageExec))
    violationRules {
        rule {
            limit {
                counter = "LINE"
                minimum = 0.95
            }
        }
        rule {
            limit {
                counter = "BRANCH"
                // Remaining branches are Kotlin-generated null-check intrinsics on framework parameters.
                minimum = 0.60
            }
        }
    }
}
