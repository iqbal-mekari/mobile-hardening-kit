name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.24.0 from the official repository
        run: |
          git clone --depth 1 --branch 3.24.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --fatal-infos
      - name: Analyze example Dart
        working-directory: example
        run: flutter analyze --fatal-infos
      - name: Test package
        run: flutter test
      - name: Test example app
        working-directory: example
        run: flutter test
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug

  native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and package the native Android core
        working-directory: native/android
        run: ./gradlew :core:assembleRelease :core:publishReleasePublicationToMavenLocal :sample:assembleDebug

  native-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Swift package for iOS
        run: xcodebuild -scheme MobileHardeningKit -destination 'generic/platform=iOS Simulator' build
      - name: Build the SwiftUI sample against the local package
        run: xcodebuild -project samples/ios/MobileHardeningKitSample.xcodeproj -scheme MobileHardeningKitSample -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
