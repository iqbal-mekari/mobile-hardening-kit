name: CI

# Every pull request runs lint, tests, and coverage gates for Dart, Android
# (native core + Flutter adapter), and iOS (native core + Flutter adapter).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.24.0

jobs:
  dart:
    name: Dart (format, analyze, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} from the official repository
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd example/flutter && flutter pub get)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/flutter/lib example/flutter/test
      - name: Analyze package
        run: flutter analyze --fatal-infos
      - name: Analyze Flutter example
        working-directory: example/flutter
        run: flutter analyze --fatal-infos
      - name: Test package with coverage
        run: flutter test --coverage
      - name: Enforce package line coverage (95%)
        run: python3 tool/check_lcov.py coverage/lcov.info 95
      - name: Test Flutter example
        working-directory: example/flutter
        run: flutter test

  android-native:
    name: Android native core (lint, test, coverage, sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Lint, unit-test, and enforce coverage for the core
        working-directory: native/android
        run: ./gradlew :core:lintDebug :core:testDebugUnitTest :core:coverageVerification
      - name: Package the core
        working-directory: native/android
        run: ./gradlew :core:assembleRelease :core:publishReleasePublicationToMavenLocal
      - name: Build the native Android sample (released AAR from GitHub Release assets)
        working-directory: example/android
        run: ./gradlew :app:assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-reports
          path: |
            native/android/core/build/reports/tests
            native/android/core/build/reports/jacoco
            native/android/core/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  android-flutter:
    name: Android Flutter adapter (lint, test, coverage, APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} from the official repository
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve example dependencies
        working-directory: example/flutter
        run: flutter pub get
      - name: Build the Flutter example APK
        working-directory: example/flutter
        run: flutter build apk --debug
      - name: Lint, unit-test, and enforce coverage for the plugin module
        working-directory: example/flutter/android
        run: ./gradlew :mobile_hardening_kit:lintDebug :mobile_hardening_kit:testDebugUnitTest :mobile_hardening_kit:coverageVerification
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-flutter-reports
          path: |
            example/flutter/build/mobile_hardening_kit/reports
          if-no-files-found: ignore

  ios-native:
    name: iOS native core (swift-format, test, coverage, sample)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[A-Za-z ]*[A-Za-z0-9]' || true)
          test -n "$DEVICE" || { echo "no iPhone simulator available"; exit 1; }
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Lint Swift (swift-format, strict)
        run: xcrun swift-format lint --strict --recursive Package.swift ios/Classes ios/Tests example/ios/MobileHardeningKitSample example/flutter/ios/RunnerTests example/flutter/ios/Runner/AppDelegate.swift
      - name: Test the Swift package with coverage
        run: xcodebuild test -scheme MobileHardeningKit -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath "$RUNNER_TEMP/spm-dd" -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/spm.xcresult"
      - name: Enforce core line coverage (95%)
        run: python3 tool/check_xccov.py "$RUNNER_TEMP/spm.xcresult" MobileHardeningKit.swift 95
      - name: Build the native iOS sample (tagged sources from GitHub via SPM)
        run: xcodebuild -project example/ios/MobileHardeningKitSample.xcodeproj -scheme MobileHardeningKitSample -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

  ios-flutter:
    name: iOS Flutter adapter (test, coverage, build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} from the official repository
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Select an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[A-Za-z ]*[A-Za-z0-9]' || true)
          test -n "$DEVICE" || { echo "no iPhone simulator available"; exit 1; }
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Resolve example dependencies
        working-directory: example/flutter
        run: flutter pub get
      - name: Build the Flutter example for the simulator
        working-directory: example/flutter
        run: flutter build ios --simulator --no-codesign
      - name: Test the Flutter iOS adapter with coverage
        working-directory: example/flutter/ios
        run: xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath "$RUNNER_TEMP/runner-dd" -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/runner.xcresult"
      - name: Enforce adapter line coverage (90%)
        run: python3 tool/check_xccov.py "$RUNNER_TEMP/runner.xcresult" MobileHardeningKitPlugin.swift 90
